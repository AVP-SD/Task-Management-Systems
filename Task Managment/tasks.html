<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Task Management System</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold text-gray-900">Task Manager</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 hover:text-gray-900">Home</a>
                    <a href="pipelines.html" class="text-gray-600 hover:text-gray-900">Pipelines</a>
                    <a href="tasks.html" class="text-indigo-600 font-medium">My Tasks</a>
                    <a href="admin.html" class="text-gray-600 hover:text-gray-900">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">My Tasks</h1>
                <p class="text-gray-600 mt-2">View and manage your submitted tasks</p>
            </div>
            <a href="pipelines.html"
               class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                Submit New Task
            </a>
        </div>

        <!-- Filter Buttons -->
        <div class="mb-6 flex space-x-4">
            <button onclick="filterTasks('all')"
                    class="px-4 py-2 rounded-md text-sm font-medium bg-indigo-600 text-white">
                All Tasks
            </button>
            <button onclick="filterTasks('pending')"
                    class="px-4 py-2 rounded-md text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">
                Pending
            </button>
            <button onclick="filterTasks('completed')"
                    class="px-4 py-2 rounded-md text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">
                Completed
            </button>
        </div>

        <!-- Tasks Table -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div id="tasks-container">
                <!-- Tasks will be loaded here -->
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-gray-600">Loading your tasks...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-12 hidden">
            <p class="text-gray-500 text-lg">No tasks found.</p>
            <a href="pipelines.html"
               class="mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                Start Working on Tasks
            </a>
        </div>
    </div>

    <script>
        let allTasks = [];

        // Sample task data (in a real app, this would come from your API)
        const sampleTasks = [
            {
                id: '1',
                userId: 'user1',
                pipelineId: 'content-review-pipeline',
                pipelineName: 'Content Review Pipeline',
                link: 'https://example.com/content1',
                status: 'pending',
                quality: null,
                createdAt: '2024-01-15T10:30:00Z'
            },
            {
                id: '2',
                userId: 'user1',
                pipelineId: 'bug-report-pipeline',
                pipelineName: 'Bug Report Pipeline',
                link: 'https://example.com/bug1',
                status: 'completed',
                quality: 8,
                createdAt: '2024-01-14T14:20:00Z'
            },
            {
                id: '3',
                userId: 'user1',
                pipelineId: 'content-review-pipeline',
                pipelineName: 'Content Review Pipeline',
                link: 'https://example.com/content2',
                status: 'in_progress',
                quality: null,
                createdAt: '2024-01-13T09:15:00Z'
            }
        ];

        // Load tasks
        async function loadTasks() {
            document.getElementById('loading').style.display = 'block';

            try {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1000));
                allTasks = sampleTasks;
                renderTasks('all');
            } catch (error) {
                console.error('Error loading tasks:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }

        // Filter and render tasks
        function filterTasks(status) {
            renderTasks(status);
        }

        function renderTasks(statusFilter) {
            const container = document.getElementById('tasks-container');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');

            loading.style.display = 'none';

            let filteredTasks = allTasks;
            if (statusFilter !== 'all') {
                filteredTasks = allTasks.filter(task => task.status === statusFilter);
            }

            if (filteredTasks.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = `
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Task</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pipeline</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quality</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${filteredTasks.map(task => `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900">
                                        <a href="${task.link}" target="_blank" class="text-indigo-600 hover:text-indigo-900">
                                            View Task
                                        </a>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm text-gray-900">${task.pipelineName}</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="status-badge status-${task.status}">
                                        ${task.status.replace('_', ' ')}
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                    ${task.quality !== null ? `${task.quality}/10` : 'Not rated'}
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    ${new Date(task.createdAt).toLocaleDateString()}
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <button onclick="viewTaskDetails('${task.id}')" class="text-indigo-600 hover:text-indigo-900">
                                        View Details
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function viewTaskDetails(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (task) {
                alert(`Task Details:\n\nID: ${task.id}\nStatus: ${task.status}\nQuality: ${task.quality !== null ? task.quality + '/10' : 'Not rated'}\nCreated: ${new Date(task.createdAt).toLocaleDateString()}`);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
